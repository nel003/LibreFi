<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Web Server</title>
    <style>
        /* A little bit of CSS to make it look nice */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #e84c3d; /* Rust orange/red color */
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        pre {
            background: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
            overflow-x: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rust Server is Live! 🚀</h1>
        <p>If you are seeing this, your static file serving is working perfectly.</p>
        
        <!-- This button triggers the JavaScript below -->
        <button onclick="checkStatus()">Check System Status</button>
        
        <!-- The results from your Rust backend will appear here -->
        <pre id="output">Click the button to fetch /status data...</pre>
    </div>

    <script>
        // This function talks to the Rust API you built
        async function checkStatus() {
            const output = document.getElementById('output');
            output.innerText = "Loading...";
            
            try {
                // Call the /status GET route on your Rust server
                const response = await fetch('/status');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // Get the text from the response and display it
                const text = await response.text();
                output.innerText = text;
                
            } catch (error) {
                output.innerText = "Error connecting to server:\n" + error.message;
            }
        }
    </script>

</body>
</html>
