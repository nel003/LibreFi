<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test Client</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #334155;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--error);
            transition: background-color 0.3s;
        }

        .status-dot.connected {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .chat-area {
            height: 400px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg-sent {
            background-color: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-recv {
            background-color: #334155;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .msg-sys {
            background-color: transparent;
            color: #94a3b8;
            font-size: 0.8rem;
            align-self: center;
            padding: 4px;
            font-style: italic;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        input {
            flex-grow: 1;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--border);
            color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>WebSocket Tester</h1>
            <div class="status">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Disconnected</span>
            </div>
        </div>

        <div class="chat-area" id="chat">
            <!-- Messages go here -->
            <div class="message msg-sys">Attempting to connect to /ws...</div>
        </div>

        <form class="input-area" id="ws-form">
            <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" disabled>
            <button type="submit" id="send-btn" disabled>Send</button>
        </form>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const form = document.getElementById('ws-form');
        const input = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');

        let ws;

        function addMessage(text, type) {
            const el = document.createElement('div');
            el.className = `message ${type}`;
            el.textContent = text;
            chat.appendChild(el);
            chat.scrollTop = chat.scrollHeight;
        }

        function connect() {
            // Use the current host but replace protocol with ws://
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `http://localhost:8000/ws`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
                input.disabled = false;
                sendBtn.disabled = false;
                addMessage('Successfully connected to WebSocket server.', 'msg-sys');
            };

            ws.onmessage = (event) => {
                addMessage(event.data, 'msg-recv');
            };

            ws.onclose = () => {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                input.disabled = true;
                sendBtn.disabled = true;
                addMessage('Connection closed. Reconnecting in 3s...', 'msg-sys');
                setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error("WebSocket error:", error);
                addMessage('An error occurred. Check console for details.', 'msg-sys');
            };
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (message && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(message);
                addMessage(message, 'msg-sent');
                input.value = '';
            }
        });

        // Initialize connection
        connect();
    </script>
</body>

</html>
